<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDC-SP2 · T2</title><style>body{font:16px system-ui;background:#f3f6fa;color:#162235;margin:0}header{background:#142b47;color:white;padding:20px}main{max-width:850px;margin:20px auto;padding:0 15px}section,.card{background:white;border-radius:12px;padding:17px;margin:12px 0;box-shadow:0 1px 5px #ccd3dd}input,select,textarea,button{box-sizing:border-box;font:inherit;padding:12px;border:1px solid #ccd3dd;border-radius:8px;width:100%;margin:6px 0}button{background:#176a50;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}small{color:#596b80}.muted{color:#5d6b7c}.hidden{display:none}h1{font-size:24px;margin:0}h2{font-size:19px}.error{color:#a32525;white-space:pre-wrap}label{display:block;margin-top:10px}#list .card{border-left:4px solid #176a50}textarea{min-height:90px}</style></head><body><header><h1>RDC-SP2 · Gestão Operacional T2</h1><div>14h–22h · Intervalo 17h–18h · Gestor: Edmar</div></header><main><section id="login"><h2>Entrar com código individual</h2><select id="name"><option>EDMAR</option><option>WILSON</option><option>JEILSON</option><option>ANA</option></select><input id="code" type="password" autocomplete="off" placeholder="Código individual"><button id="enter">Entrar</button><div id="msg" class="error" role="alert"></div></section><div id="app" class="hidden"><section><h2 id="welcome"></h2><p class="muted">Check-ins e pendências do dia. Fechamento oficial às 22h.</p><button id="refresh">Atualizar registros</button><button id="logout" style="background:#53657a">Sair</button></section><section><h2>Registrar setor</h2><label>Setor<select id="sector"></select></label><label>Situação<select id="state"><option>FINALIZADO</option><option>FINALIZADO COM PENDÊNCIAS</option><option>EM ANDAMENTO</option></select></label><label>Pendências / observações<textarea id="notes" maxlength="2000" placeholder="Descreva o que ficou pendente, se houver"></textarea></label><button id="submit">Salvar check-in</button><div id="saveMsg" role="status"></div></section><section><h2>Resumo dos 8 setores</h2><div id="list"></div></section></div></main><script>
const sectors={'SORTER':['EDMAR','WILSON'],'ESTEIRA PRINCIPAL':['JEILSON'],'ORGANIZAÇÃO DE SACAS':['EDMAR','WILSON'],'MESA E AVARIA':['ANA','EDMAR'],'DEVOLUÇÃO':['ANA'],'EXPEDIÇÃO':['JEILSON','WILSON'],'CONSOLIDAÇÃO':['EDMAR'],'PACOTES PERDIDOS OU PARADOS NO PISO':['ANA']};
const $=id=>document.getElementById(id);let token='',who='';
const SUPABASE_URL='https://eccnrkjdcnplousjvwhh.supabase.co';
const SUPABASE_KEY='sb_publishable_exY74LQvu1AJPLZs-gjdIg_omqq1WGi';
async function rpc(fn,p){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+encodeURIComponent(fn),{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify(p)});const data=await r.json().catch(()=>null);if(!r.ok)throw Error(data?.message||data?.error||('Erro HTTP '+r.status));return data}
$('enter').onclick=async()=>{const btn=$('enter');btn.disabled=true;try{$('msg').textContent='';const selected=$('name').value;const newToken=await rpc('t2_entrar',{p_nome:selected,p_codigo:$('code').value});if(typeof newToken!=='string'||!newToken)throw Error('O servidor não retornou uma sessão válida');who=selected;token=newToken;$('code').value='';$('login').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Olá, '+who+(who==='EDMAR'?' · Gestor':'');$('sector').replaceChildren(...Object.entries(sectors).filter(([s,people])=>people.includes(who)).map(([s])=>new Option(s,s)));await refresh()}catch(e){$('msg').textContent=e.message}finally{btn.disabled=false}};
$('logout').onclick=()=>{token='';who='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('code').value='';$('msg').textContent=''};$('refresh').onclick=refresh;
async function refresh(){try{const rows=await rpc('t2_listar',{p_token:token});if(!Array.isArray(rows))throw Error('Resposta inesperada ao consultar setores');const el=$('list');el.replaceChildren();for(const [s,people] of Object.entries(sectors)){const r=rows.find(x=>x.setor===s),c=document.createElement('div');c.className='card';const h=document.createElement('strong');h.textContent=s;c.append(h);const p=document.createElement('p');p.textContent=r?`${r.situacao} · ${r.responsavel} · ${new Date(r.registrado_em).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo'})}`:'PENDENTE DE CHECK-IN';c.append(p);if(r?.observacao){const n=document.createElement('p');n.textContent='Observação: '+r.observacao;c.append(n)}else{const n=document.createElement('small');n.textContent='Responsáveis: '+people.join(' / ');c.append(n)}el.append(c)}}catch(e){$('list').textContent=e.message}}
$('submit').onclick=async()=>{const btn=$('submit');btn.disabled=true;try{if($('state').value==='FINALIZADO COM PENDÊNCIAS'&&!$('notes').value.trim())throw Error('Descreva as pendências antes de salvar');$('saveMsg').textContent='Salvando...';await rpc('t2_salvar',{p_token:token,p_setor:$('sector').value,p_situacao:$('state').value,p_observacao:$('notes').value});$('saveMsg').textContent='Check-in salvo com sucesso';$('notes').value='';await refresh()}catch(e){$('saveMsg').textContent=e.message}finally{btn.disabled=false}};
</script></body></html>
