
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria RDC-SP2</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b;margin:0;padding:20px}
main{max-width:850px;margin:auto}
header{background:#123b65;color:white;padding:22px;border-radius:12px}
section{background:white;padding:20px;border-radius:12px;margin-top:18px}
label{display:block;font-weight:bold;margin-top:12px}
input,select,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:6px;font-size:16px}
textarea{min-height:75px}
button{padding:12px 16px;margin-top:15px;border:0;border-radius:6px;background:#166534;color:white;font-weight:bold;cursor:pointer}
.registro{border:1px solid #cbd5e1;padding:12px;margin-top:12px;border-radius:8px;overflow-wrap:anywhere}
small{color:#64748b}
</style>
</head>
<body>
<main>
<header>
<h1>📦 Auditoria RDC-SP2</h1>
<p>Registro e acompanhamento das auditorias operacionais</p>
</header>

<section>
<h2>Nova auditoria</h2>
<form id="formulario">
<label>Data</label>
<input type="date" id="data" required>
<label>Responsável</label>
<input id="responsavel" placeholder="Nome do auditor" required>
<label>Área auditada</label>
<select id="area" required>
<option value="">Selecione uma área</option>
<option>Esteira SP2</option>
<option>Esteira SP9</option>
<option>Consolidação</option>
<option>Expedição</option>
<option>Chegada</option>
<option>Avarias</option>
<option>Devolução</option>
<option>Pacotes perdidos</option>
<option>Operação geral</option>
</select>
<label>Resultado</label>
<select id="status" required>
<option value="">Selecione</option>
<option>Conforme</option>
<option>Não conforme</option>
<option>Em andamento</option>
</select>
<label>Observações</label>
<textarea id="observacao" placeholder="Descreva o que foi identificado"></textarea>
<label>Ação corretiva</label>
<textarea id="acao" placeholder="Informe a ação necessária"></textarea>
<button type="submit">Salvar auditoria</button>
</form>
</section>

<section>
<h2>📋 Auditorias registradas</h2>
<p id="resumo">Carregando registros...</p>
<div id="lista"></div>
<button type="button" id="exportar">Exportar CSV</button>
<p><small>Os registros ficam salvos neste navegador e não são compartilhados automaticamente entre computadores.</small></p>
</section>
</main>

<script>
(function(){
const chave="auditoria-rdc-sp2-v3";
const formulario=document.getElementById("formulario");
const lista=document.getElementById("lista");
const resumo=document.getElementById("resumo");
let registros=[];

try{
registros=JSON.parse(localStorage.getItem(chave)||"[]");
if(!Array.isArray(registros))registros=[];
}catch(e){registros=[];}

document.getElementById("data").value=new Date().toLocaleDateString("en-CA");

function renderizar(){
lista.replaceChildren();
resumo.textContent=registros.length+" auditoria(s) registrada(s).";
registros.forEach(function(r,i){
const div=document.createElement("div");
div.className="registro";
const titulo=document.createElement("strong");
titulo.textContent=r.area+" — "+r.data;
div.appendChild(titulo);
const detalhe=document.createElement("p");
detalhe.textContent="Responsável: "+r.responsavel+" | Resultado: "+r.status;
div.appendChild(detalhe);
const obs=document.createElement("p");
obs.textContent="Observações: "+(r.observacao||"Nenhuma");
div.appendChild(obs);
const acao=document.createElement("p");
acao.textContent="Ação corretiva: "+(r.acao||"Nenhuma");
div.appendChild(acao);
const excluir=document.createElement("button");
excluir.textContent="Excluir registro";
excluir.addEventListener("click",function(){
if(confirm("Excluir esta auditoria?")){
registros.splice(i,1);
localStorage.setItem(chave,JSON.stringify(registros));
renderizar();
}
});
div.appendChild(excluir);
lista.appendChild(div);
});
}

formulario.addEventListener("submit",function(e){
e.preventDefault();
const registro={
data:document.getElementById("data").value,
responsavel:document.getElementById("responsavel").value.trim(),
area:document.getElementById("area").value,
status:document.getElementById("status").value,
observacao:document.getElementById("observacao").value.trim(),
acao:document.getElementById("acao").value.trim()
};
registros.push(registro);
try{
localStorage.setItem(chave,JSON.stringify(registros));
}catch(erro){
alert("Não foi possível salvar no navegador.");
return;
}
formulario.reset();
document.getElementById("data").value=new Date().toLocaleDateString("en-CA");
renderizar();
alert("Auditoria salva!");
});

document.getElementById("exportar").addEventListener("click",function(){
const linhas=[["Data","Responsável","Área","Resultado","Observações","Ação corretiva"]];
registros.forEach(function(r){
linhas.push([r.data,r.responsavel,r.area,r.status,r.observacao,r.acao]);
});
const csv=linhas.map(function(l){
return l.map(function(v){
return '"'+String(v||"").replace(/"/g,'""')+'"';
}).join(";");
}).join("\r\n");
const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
const url=URL.createObjectURL(blob);
const link=document.createElement("a");
link.href=url;
link.download="auditoria-rdc-sp2.csv";
link.click();
URL.revokeObjectURL(url);
});
renderizar();
})();
</script>
</body>
</html>
